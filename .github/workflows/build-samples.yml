name: Navigation lifecycle example

on:
  push:
    branches-ignore:
      - main

jobs:
  run:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x
      - name: Run navigation on .NET 10
        working-directory: src
        run: dotnet run --project examples/NavigationLifecycle --configuration Release --framework net10.0
      - name: Run navigation on .NET 11
        working-directory: src
        run: dotnet run --project examples/NavigationLifecycle --configuration Release --framework net11.0
