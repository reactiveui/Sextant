name: Sample Build

on:
  push:
    branches-ignore:
      - main

env:
  productNamespacePrefix: "Sextant"

jobs:
  build:
    permissions:
      contents: read
      actions: write
    uses: reactiveui/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
    with:
      productNamespacePrefix: "Sextant"
      srcFolder: "src/examples"
      solutionFile: "SextantSample.slnx"
      installWorkloads: true
      performTests: false
